<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rate Extension</title>
  </head>
  <body>
    <h1>Choose the Store where you want to Rate/Review:</h1>
    <div id="store-buttons-container">
      <a
        href="https://chromewebstore.google.com/detail/"
        target="_blank"
        rel="noopener noreferrer"
        id="chrome"
        class="store-link"
      >
        <img
          src="../assets/chrome.webp"
          alt="Get it from Chrome Web Store"
          class="store-button"
          loading="lazy"
        />
      </a>
      <a
        href="https://addons.mozilla.org/firefox/addon/"
        target="_blank"
        rel="noopener noreferrer"
        id="firefox"
        class="store-link"
      >
        <img
          src="../assets/firefox.webp"
          alt="Get it from Firefox Addon Store"
          class="store-button"
          loading="lazy"
        />
      </a>
      <a
        href="https://microsoftedge.microsoft.com/addons/detail/"
        target="_blank"
        rel="noopener noreferrer"
        id="edge"
        class="store-link"
      >
        <img
          src="../assets/edge.webp"
          alt="Get it from Edge Store"
          class="store-button"
          loading="lazy"
        />
      </a>
    </div>
  </body>
</html>
